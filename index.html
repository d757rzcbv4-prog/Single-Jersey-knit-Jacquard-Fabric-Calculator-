<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The Active Lab - Fabric Costing Calculator</title>
  <style>
    :root {
      --bg: #0c1017;
      --card-bg: #161b26;
      --card-border: #232a3b;
      --text-main: #f0f4f8;
      --text-muted: #8b98a9;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-purple: #a855f7;
      --input-bg: #0f141d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 16px 40px 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      margin-top: 10px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .badge {
      background: #111823;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 8px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
    }

    /* Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .metric-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* Primary Colors for Metrics */
    .val-white { color: #ffffff; }
    .val-yellow { color: var(--accent-yellow); }
    .val-green { color: var(--accent-green); }

    /* Input Section */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 20px;
    }

    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sub-heading {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 16px 0 12px 0;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .input-label {
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0 10px;
      width: 120px;
    }

      width: 100%;
      background: transparent;
      border: none;
